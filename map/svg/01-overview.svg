<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 560" width="1300" height="560" role="img" aria-label="Overview: what the template installs in a project, and how the rules, the main session, the skills, the agents and the hooks connect.">
<title>Overview: what the template installs in a project, and how the rules, the main session, the skills, the agents and the hooks connect.</title>
<style>:root{--bg:#F6F7F9;--raised:#FFFFFF;--frame:#ECEFF3;--ink:#16202A;--ink-2:#46525E;--ink-3:#5F6B77;--rule:#D3D9DF;--rule-strong:#8E9AA6;--accent:#2456C7;--accent-soft:#E3EBFB;--store:#D8E9E4;--ext:#F0F1F3;--ok:#1D6B42;--ok-soft:#DEF0E5;--warn:#8A5A00;--warn-soft:#FBEFD5;--bad:#B3261E;--bad-soft:#FBE4E2;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}@media (prefers-color-scheme:dark){:root{--bg:#10161C;--raised:#18212A;--frame:#141C24;--ink:#E7ECF0;--ink-2:#B9C3CC;--ink-3:#97A3AE;--rule:#2B3742;--rule-strong:#56636F;--accent:#86A9FF;--accent-soft:#1D2A47;--store:#21403A;--ext:#1A2128;--ok:#6FD29B;--ok-soft:#173826;--warn:#E8B758;--warn-soft:#3A2C10;--bad:#F28B82;--bad-soft:#3F1D1B;}}text{font-family:var(--sans)}.t{fill:var(--ink)} .sub{fill:var(--ink-2)} .ttl{fill:var(--ink);font-weight:650} .m{font-family:var(--mono)}.cap{fill:var(--ink-3);font-size:11.5px;font-weight:600;letter-spacing:.05em}.fr-t{fill:var(--ink);font-weight:680}.lbl{font-weight:500;paint-order:stroke;stroke:var(--raised);stroke-width:4px;stroke-linejoin:round}.lk-call{fill:var(--ink-2)} .lk-main{fill:var(--accent)} .lk-fail{fill:var(--bad)} .lk-off{fill:var(--ink-3)}.bg{fill:var(--raised)}.fr-sys{fill:var(--frame);stroke:var(--ink);stroke-width:1.5} .fr-host{fill:none;stroke:var(--rule-strong);stroke-dasharray:6 4}.n-proc{fill:var(--raised);stroke:var(--ink);stroke-width:1.25} .n-store{fill:var(--store);stroke:var(--rule-strong)}.n-ext{fill:var(--ext);stroke:var(--rule-strong)} .n-off{fill:var(--raised);stroke:var(--ink-3);stroke-dasharray:5 4}.n-ok{fill:var(--ok-soft);stroke:var(--ok)} .n-warn{fill:var(--warn-soft);stroke:var(--warn)} .n-bad{fill:var(--bad-soft);stroke:var(--bad)}.e-call{stroke:var(--ink-2);stroke-width:1.4} .e-main{stroke:var(--accent);stroke-width:2.25}.e-fail{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:5 4} .e-off{stroke:var(--ink-3);stroke-width:1.4;stroke-dasharray:2 4}.h-call{fill:var(--ink-2)} .h-main{fill:var(--accent)} .h-fail{fill:var(--bad)} .h-off{fill:var(--ink-3)}</style>
<defs><marker id="f-01-overview-a-call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="h-call"/></marker><marker id="f-01-overview-s-call" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="h-call"/></marker><marker id="f-01-overview-a-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="h-main"/></marker><marker id="f-01-overview-s-main" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="h-main"/></marker><marker id="f-01-overview-a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="h-fail"/></marker><marker id="f-01-overview-s-fail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="h-fail"/></marker><marker id="f-01-overview-a-off" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="h-off"/></marker><marker id="f-01-overview-s-off" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="h-off"/></marker></defs>
<rect x="0" y="0" width="1300" height="560" class="bg"/>
<rect x="640" y="14" width="290" height="58" rx="4" class="n-ext"/>
<text x="650" y="34" class="ttl" text-anchor="start" font-size="13.5">You</text>
<text x="650" y="51" class="sub" text-anchor="start" font-size="12">ask, approve, unblock</text>
<rect x="16" y="300" width="224" height="84" rx="4" class="n-ext"/>
<text x="26" y="320" class="ttl" text-anchor="start" font-size="13.5">ClaudeCodeTemplate</text>
<text x="26" y="337" class="sub m" text-anchor="start" font-size="11.5">Template/ on main</text>
<text x="26" y="353" class="sub" text-anchor="start" font-size="12">CHANGELOG · MIGRATIONS</text>
<rect x="264" y="100" width="1020" height="444" rx="4" class="fr-sys"/>
<text x="278" y="122" class="fr-t" text-anchor="start" font-size="13.5">Your project</text>
<rect x="296" y="140" width="270" height="72" rx="4" class="n-store"/>
<text x="306" y="160" class="ttl m" text-anchor="start" font-size="13.5">CLAUDE.md</text>
<text x="306" y="177" class="sub" text-anchor="start" font-size="12">the rules · v1.3.0</text>
<text x="306" y="193" class="sub" text-anchor="start" font-size="12">replaced by template-sync</text>
<rect x="296" y="240" width="270" height="104" rx="4" class="n-store"/>
<text x="306" y="260" class="ttl" text-anchor="start" font-size="13.5">Project docs</text>
<text x="306" y="277" class="sub m" text-anchor="start" font-size="11.5">docs/SYSTEM.md</text>
<text x="306" y="293" class="sub m" text-anchor="start" font-size="11.5">docs/System/glossary.md</text>
<text x="306" y="309" class="sub m" text-anchor="start" font-size="11.5">MEMORY.md</text>
<text x="306" y="325" class="sub" text-anchor="start" font-size="12">yours: sync never touches them</text>
<rect x="296" y="372" width="270" height="112" rx="4" class="n-store"/>
<text x="306" y="392" class="ttl" text-anchor="start" font-size="13.5">Work items (on dev)</text>
<text x="306" y="409" class="sub m" text-anchor="start" font-size="11.5">docs/Pitches/I-xxxx.md</text>
<text x="306" y="425" class="sub m" text-anchor="start" font-size="11.5">docs/Tasks/T-xxxx.md</text>
<text x="306" y="441" class="sub m" text-anchor="start" font-size="11.5">docs/Projects/P-xxxx.md</text>
<text x="306" y="457" class="sub m" text-anchor="start" font-size="11.5">TESTS.md</text>
<rect x="640" y="140" width="290" height="72" rx="4" class="n-proc"/>
<text x="650" y="160" class="ttl" text-anchor="start" font-size="13.5">Main session</text>
<text x="650" y="177" class="sub" text-anchor="start" font-size="12">plans and orchestrates;</text>
<text x="650" y="193" class="sub" text-anchor="start" font-size="12">writes no production code</text>
<rect x="640" y="244" width="290" height="112" rx="4" class="n-proc"/>
<text x="650" y="264" class="ttl" text-anchor="start" font-size="13.5">Skills (9)</text>
<text x="650" y="281" class="sub m" text-anchor="start" font-size="11.5">pitch · task · spec · glossary</text>
<text x="650" y="297" class="sub m" text-anchor="start" font-size="11.5">arch-check · deployment-process · share</text>
<text x="650" y="313" class="sub m" text-anchor="start" font-size="11.5">system-map · template-sync</text>
<rect x="640" y="388" width="290" height="104" rx="4" class="n-proc"/>
<text x="650" y="408" class="ttl" text-anchor="start" font-size="13.5">Agents (5)</text>
<text x="650" y="425" class="sub m" text-anchor="start" font-size="11.5">code-reviewer · doc-updater</text>
<text x="650" y="441" class="sub m" text-anchor="start" font-size="11.5">docs-audit · implementer · tester</text>
<text x="650" y="457" class="sub" text-anchor="start" font-size="12">run the Execution Loop</text>
<rect x="1000" y="140" width="260" height="120" rx="4" class="n-proc"/>
<text x="1010" y="160" class="ttl" text-anchor="start" font-size="13.5">Claude Code hooks</text>
<text x="1010" y="177" class="sub m" text-anchor="start" font-size="11.5">settings.json → dispatcher.sh</text>
<text x="1010" y="193" class="sub" text-anchor="start" font-size="12">pre-tool: 5 hard gates</text>
<text x="1010" y="209" class="sub" text-anchor="start" font-size="12">session-start: version + updates</text>
<text x="1010" y="225" class="sub" text-anchor="start" font-size="12">post-tool · stop: project/ only</text>
<rect x="1000" y="292" width="260" height="64" rx="4" class="n-proc"/>
<text x="1010" y="312" class="ttl m" text-anchor="start" font-size="13.5">.githooks/pre-commit</text>
<text x="1010" y="329" class="sub" text-anchor="start" font-size="12">stops secrets outside Claude</text>
<rect x="1000" y="388" width="260" height="88" rx="4" class="n-off"/>
<text x="1010" y="408" class="ttl m" text-anchor="start" font-size="13.5">.claude/arch-check.sh</text>
<text x="1010" y="425" class="sub" text-anchor="start" font-size="12">invariants (optional, yours)</text>
<text x="1010" y="441" class="sub" text-anchor="start" font-size="12">run by hook 05 and in CI</text>
<polyline points="785,72 785,140" class="e-call" fill="none" marker-end="url(#f-01-overview-a-call)" marker-start="url(#f-01-overview-s-call)"/>
<text x="795" y="118" class="lbl lk-call" text-anchor="start" font-size="11.5">requests / approvals</text>
<polyline points="128,300 128,176 296,176" class="e-main" fill="none" marker-end="url(#f-01-overview-a-main)"/>
<text x="196" y="168" class="lbl lk-main" text-anchor="middle" font-size="11.5">template-sync</text>
<polyline points="566,176 640,176" class="e-main" fill="none" marker-end="url(#f-01-overview-a-main)"/>
<text x="603" y="168" class="lbl lk-main" text-anchor="middle" font-size="11.5">loads</text>
<polyline points="566,272 600,272 600,198 640,198" class="e-call" fill="none" marker-end="url(#f-01-overview-a-call)"/>
<polyline points="785,212 785,244" class="e-call" fill="none" marker-end="url(#f-01-overview-a-call)"/>
<text x="795" y="233" class="lbl lk-call" text-anchor="start" font-size="11.5">invokes</text>
<polyline points="640,330 612,330 612,428 566,428" class="e-main" fill="none" marker-end="url(#f-01-overview-a-main)"/>
<text x="590" y="420" class="lbl lk-main" text-anchor="middle" font-size="11.5">write</text>
<polyline points="930,196 962,196 962,440 930,440" class="e-call" fill="none" marker-end="url(#f-01-overview-a-call)"/>
<polyline points="1000,166 930,166" class="e-fail" fill="none" marker-end="url(#f-01-overview-a-fail)"/>
<text x="965" y="158" class="lbl lk-fail" text-anchor="middle" font-size="11.5">deny / ask</text>
</svg>
