<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 350" width="1300" height="350" role="img" aria-label="Lifecycle of work: from an idea to a pitch, task or project, to the Execution Loop in a worktree, and from dev to tst and main.">
<title>Lifecycle of work: from an idea to a pitch, task or project, to the Execution Loop in a worktree, and from dev to tst and main.</title>
<style>:root{--bg:#F6F7F9;--raised:#FFFFFF;--frame:#ECEFF3;--ink:#16202A;--ink-2:#46525E;--ink-3:#5F6B77;--rule:#D3D9DF;--rule-strong:#8E9AA6;--accent:#2456C7;--accent-soft:#E3EBFB;--store:#D8E9E4;--ext:#F0F1F3;--ok:#1D6B42;--ok-soft:#DEF0E5;--warn:#8A5A00;--warn-soft:#FBEFD5;--bad:#B3261E;--bad-soft:#FBE4E2;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}@media (prefers-color-scheme:dark){:root{--bg:#10161C;--raised:#18212A;--frame:#141C24;--ink:#E7ECF0;--ink-2:#B9C3CC;--ink-3:#97A3AE;--rule:#2B3742;--rule-strong:#56636F;--accent:#86A9FF;--accent-soft:#1D2A47;--store:#21403A;--ext:#1A2128;--ok:#6FD29B;--ok-soft:#173826;--warn:#E8B758;--warn-soft:#3A2C10;--bad:#F28B82;--bad-soft:#3F1D1B;}}text{font-family:var(--sans)}.t{fill:var(--ink)} .sub{fill:var(--ink-2)} .ttl{fill:var(--ink);font-weight:650} .m{font-family:var(--mono)}.cap{fill:var(--ink-3);font-size:11.5px;font-weight:600;letter-spacing:.05em}.fr-t{fill:var(--ink);font-weight:680}.lbl{font-weight:500;paint-order:stroke;stroke:var(--raised);stroke-width:4px;stroke-linejoin:round}.lk-call{fill:var(--ink-2)} .lk-main{fill:var(--accent)} .lk-fail{fill:var(--bad)} .lk-off{fill:var(--ink-3)}.bg{fill:var(--raised)}.fr-sys{fill:var(--frame);stroke:var(--ink);stroke-width:1.5} .fr-host{fill:none;stroke:var(--rule-strong);stroke-dasharray:6 4}.n-proc{fill:var(--raised);stroke:var(--ink);stroke-width:1.25} .n-store{fill:var(--store);stroke:var(--rule-strong)}.n-ext{fill:var(--ext);stroke:var(--rule-strong)} .n-off{fill:var(--raised);stroke:var(--ink-3);stroke-dasharray:5 4}.n-ok{fill:var(--ok-soft);stroke:var(--ok)} .n-warn{fill:var(--warn-soft);stroke:var(--warn)} .n-bad{fill:var(--bad-soft);stroke:var(--bad)}.e-call{stroke:var(--ink-2);stroke-width:1.4} .e-main{stroke:var(--accent);stroke-width:2.25}.e-fail{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:5 4} .e-off{stroke:var(--ink-3);stroke-width:1.4;stroke-dasharray:2 4}.h-call{fill:var(--ink-2)} .h-main{fill:var(--accent)} .h-fail{fill:var(--bad)} .h-off{fill:var(--ink-3)}</style>
<defs><marker id="f-02-lifecycle-a-call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="h-call"/></marker><marker id="f-02-lifecycle-s-call" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="h-call"/></marker><marker id="f-02-lifecycle-a-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="h-main"/></marker><marker id="f-02-lifecycle-s-main" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="h-main"/></marker><marker id="f-02-lifecycle-a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="h-fail"/></marker><marker id="f-02-lifecycle-s-fail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="h-fail"/></marker><marker id="f-02-lifecycle-a-off" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="h-off"/></marker><marker id="f-02-lifecycle-s-off" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="h-off"/></marker></defs>
<rect x="0" y="0" width="1300" height="350" class="bg"/>
<rect x="150" y="40" width="500" height="290" rx="4" class="fr-sys"/>
<text x="164" y="62" class="fr-t" text-anchor="start" font-size="13.5">Planning · primary checkout on dev</text>
<rect x="680" y="40" width="300" height="290" rx="4" class="fr-host"/>
<text x="694" y="62" class="fr-t" text-anchor="start" font-size="13.5">Code · one worktree per branch</text>
<rect x="1010" y="40" width="274" height="290" rx="4" class="fr-sys"/>
<text x="1024" y="62" class="fr-t" text-anchor="start" font-size="13.5">Promotion</text>
<rect x="16" y="140" width="110" height="56" rx="4" class="n-ext"/>
<text x="26" y="160" class="ttl" text-anchor="start" font-size="13.5">Idea</text>
<text x="26" y="177" class="sub" text-anchor="start" font-size="12">or a change</text>
<rect x="180" y="124" width="180" height="88" rx="4" class="n-store"/>
<text x="190" y="144" class="ttl" text-anchor="start" font-size="13.5">Pitch</text>
<text x="190" y="161" class="sub m" text-anchor="start" font-size="11.5">docs/Pitches/I-xxxx.md</text>
<text x="190" y="177" class="sub" text-anchor="start" font-size="12">skill pitch</text>
<rect x="180" y="250" width="180" height="56" rx="4" class="n-off"/>
<text x="190" y="270" class="ttl" text-anchor="start" font-size="13.5">Archived</text>
<text x="190" y="287" class="sub" text-anchor="start" font-size="12">[ARCHIVED] in INDEX</text>
<rect x="440" y="84" width="190" height="88" rx="4" class="n-store"/>
<text x="450" y="104" class="ttl" text-anchor="start" font-size="13.5">Task</text>
<text x="450" y="121" class="sub m" text-anchor="start" font-size="11.5">docs/Tasks/T-xxxx.md</text>
<text x="450" y="137" class="sub" text-anchor="start" font-size="12">skill task</text>
<rect x="440" y="216" width="190" height="104" rx="4" class="n-store"/>
<text x="450" y="236" class="ttl" text-anchor="start" font-size="13.5">Project</text>
<text x="450" y="253" class="sub m" text-anchor="start" font-size="11.5">docs/Projects/P-xxxx.md</text>
<text x="450" y="269" class="sub" text-anchor="start" font-size="12">+ spec package</text>
<text x="450" y="285" class="sub" text-anchor="start" font-size="12">skill spec</text>
<rect x="700" y="110" width="260" height="150" rx="4" class="n-proc"/>
<text x="710" y="130" class="ttl" text-anchor="start" font-size="13.5">Execution Loop</text>
<text x="710" y="147" class="sub m" text-anchor="start" font-size="11.5">.claude/worktrees/&lt;branch&gt;</text>
<text x="710" y="163" class="sub m" text-anchor="start" font-size="11.5">task-T-xxxx-&lt;desc&gt;</text>
<text x="710" y="179" class="sub m" text-anchor="start" font-size="11.5">scope-P-xxxx-N-&lt;desc&gt;</text>
<text x="710" y="195" class="sub" text-anchor="start" font-size="12">implementer → reviewer →</text>
<text x="710" y="211" class="sub" text-anchor="start" font-size="12">tester → doc-updater</text>
<rect x="1030" y="84" width="234" height="60" rx="4" class="n-store"/>
<text x="1040" y="104" class="ttl" text-anchor="start" font-size="13.5">dev</text>
<text x="1040" y="121" class="sub" text-anchor="start" font-size="12">integration + planning</text>
<rect x="1030" y="174" width="234" height="60" rx="4" class="n-store"/>
<text x="1040" y="194" class="ttl" text-anchor="start" font-size="13.5">tst</text>
<text x="1040" y="211" class="sub" text-anchor="start" font-size="12">regression + docs-audit</text>
<rect x="1030" y="264" width="234" height="56" rx="4" class="n-store"/>
<text x="1040" y="284" class="ttl" text-anchor="start" font-size="13.5">main</text>
<text x="1040" y="301" class="sub" text-anchor="start" font-size="12">production (prd)</text>
<polyline points="126,168 180,168" class="e-main" fill="none" marker-end="url(#f-02-lifecycle-a-main)"/>
<polyline points="71,140 71,24 535,24 535,84" class="e-call" fill="none" marker-end="url(#f-02-lifecycle-a-call)"/>
<text x="300" y="18" class="lbl lk-call" text-anchor="middle" font-size="11.5">small change or hotfix: straight to a task</text>
<polyline points="360,150 400,150 400,118 440,118" class="e-main" fill="none" marker-end="url(#f-02-lifecycle-a-main)"/>
<polyline points="360,190 400,190 400,268 440,268" class="e-main" fill="none" marker-end="url(#f-02-lifecycle-a-main)"/>
<polyline points="270,212 270,250" class="e-off" fill="none" marker-end="url(#f-02-lifecycle-a-off)"/>
<polyline points="535,172 535,216" class="e-call" fill="none" marker-end="url(#f-02-lifecycle-a-call)"/>
<text x="545" y="198" class="lbl lk-call" text-anchor="start" font-size="11.5">4 triggers</text>
<polyline points="630,128 700,128" class="e-main" fill="none" marker-end="url(#f-02-lifecycle-a-main)"/>
<text x="665" y="120" class="lbl lk-main" text-anchor="middle" font-size="11.5">Ready</text>
<polyline points="630,268 665,268 665,230 700,230" class="e-main" fill="none" marker-end="url(#f-02-lifecycle-a-main)"/>
<text x="668" y="284" class="lbl lk-main" text-anchor="middle" font-size="11.5">per scope</text>
<polyline points="960,140 995,140 995,114 1030,114" class="e-main" fill="none" marker-end="url(#f-02-lifecycle-a-main)"/>
<text x="995" y="106" class="lbl lk-main" text-anchor="middle" font-size="11.5">merge</text>
<polyline points="1147,144 1147,174" class="e-main" fill="none" marker-end="url(#f-02-lifecycle-a-main)"/>
<text x="1157" y="163" class="lbl lk-main" text-anchor="start" font-size="11.5">project complete</text>
<polyline points="1147,234 1147,264" class="e-main" fill="none" marker-end="url(#f-02-lifecycle-a-main)"/>
<text x="1157" y="253" class="lbl lk-main" text-anchor="start" font-size="11.5">your approval</text>
</svg>
